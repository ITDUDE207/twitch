<input id="username" placeholder="Twitch username">

<button onclick="loadStream()">Watch</button>

<div id="stream"></div>

<script>
function loadStream() {
    const username = document.getElementById("username").value.trim();

    if (!username) return;

    document.getElementById("stream").innerHTML = `
        <iframe
            src="https://player.twitch.tv/?channel=${encodeURIComponent(username)}&parent=itdude207.github.com"
            width="100%"
            height="600"
            allowfullscreen>
        </iframe>
    `;
}
</script>
